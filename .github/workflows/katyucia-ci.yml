name: Katyucia site CI

on:
  push:
    paths: ["sites/katyucia/**", ".github/workflows/katyucia-ci.yml"]
  pull_request:
    paths: ["sites/katyucia/**", ".github/workflows/katyucia-ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/katyucia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sites/katyucia/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
